name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :app:assembleDebug --no-daemon
      - run: ./gradlew :app:assembleRelease --no-daemon
      - name: apk size budget
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          size=$(stat -c%s "$apk")
          echo "release APK: $size bytes ($((size / 1024)) KiB)"
          test "$size" -le 3000000

  ios:
    # VGSL (a DivKit dependency) needs the Swift toolchain of Xcode 26
    # (SendableMetatype), which the macos-15 image does not carry.
    runs-on: macos-26
    defaults:
      run:
        working-directory: shell-ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project LatawiecShell.xcodeproj -scheme LatawiecShell
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
