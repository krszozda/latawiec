name: LatawiecShell
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  DivKit:
    url: https://github.com/divkit/divkit-ios
    exactVersion: 33.10.0
targets:
  LatawiecShell:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    dependencies:
      - package: DivKit
        product: DivKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.krszozda.latawiec.shell
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A store build overrides this on the xcodebuild command line and the
        # Info.plist below bakes it in; empty means the dev fallback chain.
        LATAWIEC_SERVER_URL: ""
        # The custom deep-link scheme ("latawiec://product/42"); a store build
        # overrides it the same way.
        LATAWIEC_URL_SCHEME: latawiec
        # Store builds override these on the xcodebuild command line; the
        # Info.plist below reads them, so the overrides actually land.
        LATAWIEC_APP_NAME: Latawiec
        # Shown in the system location prompt; say what the app does with a
        # fix, or the App Store review sends the build back.
        LATAWIEC_LOCATION_REASON: Shows you content for where you are.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        LatawiecServerURL: $(LATAWIEC_SERVER_URL)
        CFBundleDisplayName: $(LATAWIEC_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(LATAWIEC_URL_SCHEME)
        NSLocationWhenInUseUsageDescription: $(LATAWIEC_LOCATION_REASON)
        NSAppTransportSecurity:
          # The dev loop talks plain http/ws to a local server; anything
          # beyond the local network must use TLS.
          NSAllowsLocalNetworking: true
  LatawiecShellTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LatawiecShell
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LatawiecShell.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LatawiecShell"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LatawiecShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LatawiecShell
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
